# KatsuTun — sumber script & branding.
#
# Ini satu-satunya tempat identitas repo disimpan di VPS. File ini dipasang ke
# /etc/katsutun/repo.conf saat install, lalu di-source oleh seluruh script.
#
# Pindah repo / pakai fork:
#   * saat install : GH_USER=namaku GH_REPO=forkku ./setup.sh
#   * setelah install : edit /etc/katsutun/repo.conf lalu `katsu-update apply --force`
#     (ganti branch cukup dengan `katsu-update branch <nama>` / menu-update -> 06)
#
# File ini di-source bash. Bentuk "${VAR:-default}" dipertahankan supaya nilai
# dari environment tetap bisa menimpa isi file saat install.

# --- sumber repo ---
GH_USER="${GH_USER:-Recva-by-katsu}"
GH_REPO="${GH_REPO:-autosc}"
GH_BRANCH="${GH_BRANCH:-main}"

# --- branding ---
BRAND="${BRAND:-KatsuTun}"

# --- turunan, tidak perlu diubah ---
REPO_SLUG="$GH_USER/$GH_REPO"
REPO_URL="https://github.com/$REPO_SLUG"
ISSUES_URL="$REPO_URL/issues"
RAW="https://raw.githubusercontent.com/$REPO_SLUG/$GH_BRANCH"

# Konfigurasi kredensial backup berada di /etc/katsutun/backup.conf (mode 600),
# bukan di repository atau repo.conf yang dapat dibaca pengguna lokal.
