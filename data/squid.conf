# KatsuTun Premium - squid (HTTP proxy)
#
# File ini sengaja ringkas. Sebelumnya data/squid.conf adalah contoh bawaan
# Ubuntu/Debian yang utuh (~2000 baris komentar) dengan aturan:
#     http_access allow localhost
#     http_access deny all
# Akibatnya proxy 3128 hanya bisa dipakai dari dalam VPS: semua client dari
# internet mendapat 403, dan CONNECT hanya boleh ke port 443 sehingga aplikasi
# atau game yang memakai port lain gagal.
#
# CATATAN KEAMANAN: proxy ini terbuka untuk siapa pun yang tahu IP VPS.
# Batasi kalau tidak dipakai publik, misalnya dengan menambahkan
#     acl pelanggan src 103.28.12.0/24
#     http_access allow pelanggan
# dan menghapus baris "http_access allow all" di bawah.

http_port 3128

visible_hostname katsutun
via off
forwarded_for delete

acl all src all
acl localhost src 127.0.0.1/32
acl SSL_ports port 443
acl SSL_ports port 1025-65535
acl Safe_ports port 80 21 443 70 210 280 488 591 777 1025-65535
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localhost manager
http_access deny manager
http_access allow localhost
http_access allow all
http_access deny all

# Proxy murni: tidak menyimpan objek, jadi RAM/disk VPS tidak terbebani.
cache deny all
access_log none
cache_log /var/log/squid/cache.log
